name: CI – FastAPI

on:
  pull_request:
    branches: 
      - main
  push:
    branches: 
      - dev

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi
          pip install httpx pytest-cov safety

      - name: Vérifier la sécurité des dépendances
        run: |
          safety check -r app/requirements.txt

      - name: Exécuter les tests et mesurer la couverture
        run: |
          export PYTHONPATH=$(pwd)
          pytest --cov=app --cov-report=term-missing --maxfail=1 --disable-warnings